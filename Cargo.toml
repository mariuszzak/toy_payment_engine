[package]
name = "payments-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Streaming CSV payments engine: deposits, withdrawals, disputes and chargebacks"
publish = false

[dependencies]
anyhow = "=1.0.104"
csv = "=1.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"

[dev-dependencies]
proptest = "=1.11.0"
rstest = "=0.27.0"

[lints.rust]
unsafe_code = "forbid"
# Items in private modules are pub(crate), so the public API is visible at a glance.
# The lint misses items reachable through a public trait impl (such as RawRecord via
# TryFrom), so those are marked pub(crate) by hand.
unreachable_pub = "warn"

[lints.clippy]
# Every lint exception must say why.
allow_attributes_without_reason = "deny"
# No floating point anywhere: money is fixed-point.
disallowed_types = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
default_numeric_fallback = "deny"
# No panics and no silent truncation in production code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
# Printing macros panic when a stream is closed; write through a handle instead.
print_stdout = "deny"
print_stderr = "deny"
